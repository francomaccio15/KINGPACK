server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;

    # API → backend Express en :3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 120s: la facturación electrónica (POST /ventas/:id/facturar, /notas-credito,
        # /arca/*) llama a AFIP y a veces tarda. Con 60s nginx cortaba a mitad y
        # devolvía una página HTML de error 504 que el frontend no podía parsear como
        # JSON ("Unexpected token '<'"), aunque el CAE muchas veces sí se emitía.
        proxy_read_timeout 120s;
    }

    # Frontend Next.js en :3000 (incluye HMR/_next assets)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
