# KING PACK — nginx (refleja lo que corre en el VPS: /etc/nginx/sites-enabled/kingpack).
# HTTPS gestionado por Certbot (Let's Encrypt). NO es aplicado por el auto-deploy:
# para cambiarlo hay que editar el archivo en el VPS y `nginx -t && systemctl reload nginx`.
server {
    server_name kingpack.macciotec.com;

    client_max_body_size 10M;
    location /static/ { alias /var/www/static/; }

    # API → backend Express en :3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 120s: la facturación electrónica (POST /ventas/:id/facturar, /notas-credito,
        # /arca/*) llama a AFIP y a veces tarda. Con 60s nginx cortaba a mitad y
        # devolvía una página HTML de error 504 que el frontend no podía parsear como
        # JSON ("Unexpected token '<'"), aunque el CAE muchas veces sí se emitía.
        proxy_read_timeout 120s;
    }

    # Frontend Next.js en :3000 (incluye HMR/_next assets)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kingpack.macciotec.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kingpack.macciotec.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = kingpack.macciotec.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kingpack.macciotec.com;
    return 404; # managed by Certbot


}
